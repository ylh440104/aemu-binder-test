name: binder test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: fetch qemu
        run: |
          chmod +x qemu-arm
          ./qemu-arm --version
          chmod +x fw/system/bin/*

      - name: install cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf

      - name: build client
        run: |
          arm-linux-gnueabihf-gcc -static -O2 -o bref bref.c
          file bref

      - name: build binderd
        run: |
          gcc -O2 -Wall -Wno-unused-function -D_GNU_SOURCE -o /tmp/sbd binderd/sensesbinderd.c
          ls -l /tmp/sbd

      - name: test servicemanager
        run: |
          set -x
          rm -f /tmp/b.sock /tmp/bd.log /tmp/sm.log
          nohup /tmp/sbd -s /tmp/b.sock -v > /tmp/bd.log 2>&1 &
          sleep 1
          cat /tmp/bd.log
          GUEST_BINDER=/tmp/b.sock GUEST_VERBOSE=1 timeout 10 ./qemu-arm -L fw fw/system/bin/servicemanager > /tmp/sm.log 2>&1 || true
          echo '=== servicemanager ==='
          cat /tmp/sm.log
          echo '=== daemon ==='
          tail -40 /tmp/bd.log
          pkill -f '/tmp/sbd' || true

      - name: test surfaceflinger
        run: |
          set -x
          rm -f /tmp/b.sock /tmp/bd.log /tmp/sf-binder.log
          nohup /tmp/sbd -s /tmp/b.sock -v > /tmp/bd.log 2>&1 &
          sleep 1
          GUEST_BINDER=/tmp/b.sock GUEST_BINDER_VERBOSE=1 GUEST_BINDER_LOG=/tmp/sf-binder.log timeout 12 ./qemu-arm -L fw fw/system/bin/surfaceflinger > /tmp/sf-binder.log 2>&1 || true
          echo '=== surfaceflinger stdout/stderr ==='
          head -50 /tmp/sf-binder.log
          echo '=== daemon ==='
          tail -40 /tmp/bd.log
          pkill -f '/tmp/sbd' || true

      - name: test own object round trip
        run: |
          set -x
          rm -f /tmp/b.sock /tmp/bd.log /tmp/sm.log /tmp/cl.log
          nohup /tmp/sbd -s /tmp/b.sock -v > /tmp/bd.log 2>&1 &
          sleep 1
          GUEST_BINDER=/tmp/b.sock GUEST_VERBOSE=1 nohup ./qemu-arm -L fw fw/system/bin/servicemanager > /tmp/sm.log 2>&1 &
          sleep 2
          # registers its own binder object, then looks the name up again. The service manager
          # answers the lookup by handing that same object back, which is where a node whose own
          # reference was never counted got released and the caller died on a dead pointer.
          GUEST_BINDER=/tmp/b.sock GUEST_VERBOSE=1 timeout 10 ./qemu-arm -L fw ./bref > /tmp/cl.log 2>&1 || true
          echo '=== client ==='
          cat /tmp/cl.log
          echo '=== daemon ==='
          tail -60 /tmp/bd.log
          pkill -f '/tmp/sbd' || true
          pkill -f 'qemu-arm' || true

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            /tmp/sm.log
            /tmp/sf-binder.log
            /tmp/bd.log